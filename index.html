<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmation</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; max-width: 400px; width: 90%; }
        
        /* Firm Name Styling */
        h2 { color: #1a1a1a; margin-bottom: 20px; font-size: 24px; font-weight: 600; }
        
        /* Sky-Blue Highlight Box (Like Telegram Blockquote, No Quotes) */
        .highlight-box { background-color: #e3f2fd; border-left: 4px solid #2196f3; padding: 12px; border-radius: 4px; margin: 20px 0; text-align: left; font-size: 15px; color: #0d47a1; word-wrap: break-word; }
        
        .label-text { font-size: 16px; color: #4a4a4a; display: block; text-align: left; margin-bottom: 5px; }
        input[type="number"] { width: 100%; padding: 12px; margin: 10px 0 20px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
        input:focus { border-color: #2196f3; outline: none; }
        
        button { background-color: #0088cc; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background-color: #0077b3; }
        .success-msg { color: #2e7d32; font-weight: bold; margin-top: 15px; display: none; background: #e8f5e9; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. Firm Name Dynamic Display -->
    <h2 id="firmName">Loading Firm...</h2>
    
    <!-- 2. Sky-Blue Highlight Box without any backticks/quotes -->
    <div class="highlight-box" id="instructionBox">
        Please enter quantity for ...
    </div>
    
    <label class="label-text" for="quantityInput">Quantity:</label>
    <input type="number" id="quantityInput" placeholder="Enter quantity here..." required>
    
    <button onclick="submitToN8N()">Submit Response</button>
    
    <div id="successMessage" class="success-msg">Quantity Submitted Successfully! You can close this window.</div>
</div>

<script>
    // URL parameters se data extract karna
    const urlParams = new URLSearchParams(window.location.search);
    const n8nResponseUrl = urlParams.get('response_url'); // n8n ka automatic response url
    const firmName = urlParams.get('firm') || 'Our Firm';
    const instrument = urlParams.get('ins') || '';
    const nature = urlParams.get('nat') || '';

    // HTML Elements ko update karna
    document.getElementById('firmName').innerText = firmName;
    document.getElementById('instructionBox').innerText = `Please enter quantity for ${instrument} : ${nature}`;

    function submitToN8N() {
        const qty = document.getElementById('quantityInput').value;
        if(!qty) return alert("Please enter quantity first!");
        if(!n8nResponseUrl) return alert("Error: Missing response channel from n8n.");

        // n8n Wait for Response node (Free Text) direct string body accept karta hai
        fetch(n8nResponseUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: qty // Yeh aapki enter ki hui quantity ko seedhe n8n me bhej dega
        })
        .then(response => {
            if(response.ok) {
                document.getElementById('successMessage').style.display = 'block';
                document.getElementById('quantityInput').disabled = true;
                document.querySelector('button').disabled = true;
                document.querySelector('button').style.background = '#ccc';
            } else {
                alert("n8n node failed to receive response.");
            }
        })
        .catch(err => alert("Error connecting to n8n channel."));
    }
</script>

</body>
</html>
